name: Build Stalwart SCIM Connector
on:
  push:
    branches: [ "main", "release/1.0.8", "release/1.0.9", "release/2.0.1", "release/2.0.1" ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stalwart-scim-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build OSGi bundle and run factory smoke test
        run: mvn -B -ntp clean verify
      - name: Verify OSGi bundle metadata, DS descriptor and diagnostic markers
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find components/org.stalwart.identity.provisioning.connector.scim/target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          python3 - "$JAR" <<'PY'
          import sys
          import zipfile
          import xml.etree.ElementTree as ET

          jar = sys.argv[1]
          with zipfile.ZipFile(jar) as archive:
              raw = archive.read("META-INF/MANIFEST.MF").decode("utf-8")
              names = archive.namelist()
              class_data = archive.read(
                  "org/stalwart/identity/provisioning/connector/scim/internal/"
                  "StalwartSCIMConnectorServiceComponent.class"
              )

          unfolded = []
          for line in raw.replace("\r\n", "\n").split("\n"):
              if line.startswith(" ") and unfolded:
                  unfolded[-1] += line[1:]
              else:
                  unfolded.append(line)
          attributes = {}
          for line in unfolded:
              if ": " in line:
                  key, value = line.split(": ", 1)
                  attributes[key] = value

          version = attributes.get("Bundle-Version", "")
          imports = attributes.get("Import-Package", "")
          service_component = attributes.get("Service-Component", "")
          require_capability = attributes.get("Require-Capability", "")
          assert version == "2.0.1", f"Unexpected Bundle-Version: {version!r}"
          assert attributes.get("Bundle-SymbolicName", "").split(";")[0] == (
              "org.stalwart.identity.provisioning.connector.scim"
          ), "Unexpected Bundle-SymbolicName"
          assert attributes.get("Bundle-ActivationPolicy") == "lazy", (
              f"Unexpected Bundle-ActivationPolicy: {attributes.get('Bundle-ActivationPolicy')!r}"
          )
          assert attributes.get("Bundle-StartLevel") == "1", (
              f"Unexpected Bundle-StartLevel: {attributes.get('Bundle-StartLevel')!r}"
          )

          expected_extender = 'osgi.extender;filter:="(&(osgi.extender=osgi.component)(version>=1.3.0)(!(version>=2.0.1)))"'
          expected_ee = 'osgi.ee;filter:="(&(osgi.ee=JavaSE)(version>=21))"'
          assert require_capability.count("osgi.extender;filter") == 1, (
              "Expected exactly one SCR extender requirement: " + require_capability
          )
          assert expected_extender in require_capability, (
              "Missing/wrong osgi.extender requirement: " + require_capability
          )
          assert expected_ee in require_capability, (
              "Missing/wrong JavaSE >=21 requirement: " + require_capability
          )
          assert 'org.wso2.carbon.identity.provisioning;version="[7.10,8)"' in imports, (
              "Missing WSO2 provisioning package import: " + imports
          )
          assert 'org.wso2.carbon.identity.application.common.model;version="[7.10,8)"' in imports, (
              "Missing WSO2 application.common package import: " + imports
          )
          assert service_component and "OSGI-INF/" in service_component, (
              "Missing Service-Component manifest header"
          )

          ds_files = [name for name in names if name.startswith("OSGI-INF/") and name.endswith(".xml")]
          assert ds_files, "No generated OSGi Declarative Services XML found"
          expected_name = (
              "org.stalwart.identity.provisioning.connector.scim.internal."
              "StalwartSCIMConnectorServiceComponent"
          )
          component_xml = None
          for name in ds_files:
              with zipfile.ZipFile(jar) as archive:
                  root = ET.fromstring(archive.read(name))
              if root.attrib.get("name") == expected_name:
                  component_xml = (name, root)
                  break
          assert component_xml, "Generated Stalwart DS component descriptor not found"
          descriptor_name, root = component_xml
          assert root.tag.endswith("component"), f"Unexpected DS XML root: {root.tag}"
          namespace = root.tag.split("}")[0].lstrip("{")
          assert namespace in {
              "http://www.osgi.org/xmlns/scr/v1.3.0",
              "http://www.osgi.org/xmlns/scr/v1.4.0",
          }, f"Unexpected DS namespace: {namespace}"
          assert root.attrib.get("immediate") == "true", "DS component must be immediate"
          assert root.attrib.get("activate") == "activate", "Missing activate method"
          assert root.attrib.get("deactivate") == "deactivate", "Missing deactivate method"

          for marker in (
              "STALWART-SCIM STATIC INIT ENTERING v2.0.1",
              "STALWART-SCIM STATIC INIT DONE v2.0.1",
              "STALWART-SCIM CONSTRUCTOR v2.0.1",
              "STALWART-SCIM ACTIVATE START v2.0.1",
              "STALWART-SCIM ACTIVATE END v2.0.1",
              "STALWART-SCIM ACTIVATE FAILED v2.0.1",
          ):
              assert marker.encode() in class_data, f"Missing bytecode diagnostic marker: {marker}"

          assert "lib/gson-2.11.0.jar" in names, "Nested Gson dependency is missing"
          assert not any(name.startswith("org/wso2/") for name in names), (
              "WSO2 API classes must not be embedded in this custom bundle"
          )
          signatures = [
              name for name in names
              if name.upper().startswith("META-INF/")
              and name.upper().endswith((".SF", ".RSA", ".DSA", ".EC"))
          ]
          assert not signatures, f"JAR must remain unsigned; found: {signatures}"

          print(f"Verified {jar}: Bundle-Version={version}")
          print(f"Verified DS descriptor: {descriptor_name} ({namespace})")
          print("Verified exactly one SCR extender requirement and JavaSE >=21.")
          print("Verified Bundle-StartLevel=1 and Bundle-ActivationPolicy=lazy.")
          print("Verified WSO2 Import-Package ranges and no embedded WSO2 classes.")
          print("Verified v2.0.1 static-init, constructor and activation diagnostic markers.")
          source_path = (
              "components/org.stalwart.identity.provisioning.connector.scim/src/main/java/"
              "org/stalwart/identity/provisioning/connector/scim/StalwartSCIMProvisioningConnector.java"
          )
          with open(source_path, encoding="utf-8") as source_file:
              source = source_file.read()
          assert 'addReplace(operations, "userName"' not in source, (
              "userName must never be included in an update PATCH"
          )
          assert 'addReplace(operations, "externalId"' not in source, (
              "externalId must remain immutable after account creation"
          )
          assert 'addReplace(operations, "displayName"' in source, (
              "Expected Stalwart displayName PATCH support"
          )
          assert "joinName(given, family)" in source, (
              "Expected structured name parts to be composed into Stalwart displayName"
          )
          assert 'if (!isEmailMembershipGroup(group))' in source, (
              "Email entitlement must not be provisioned as a Stalwart Group"
          )
          assert 'RESOURCE_ID_CACHE' in source and 'CACHE_TTL_MILLIS' in source, (
              "Expected endpoint-scoped TTL resource ID cache"
          )
          assert 'Semaphore' in source and 'sendWithLimit' in source, (
              "Expected bounded concurrent SCIM HTTP requests"
          )
          assert 'requestAt(profileUpdateBaseUrl()' in source, (
              "Expected a separate configurable profile-update SCIM endpoint"
          )
          assert "targetUserIdentifier(attrs" in source, (
              "Group membership updates must resolve users through the stable identifier"
          )
          assert "EMAIL_ALIASES_CLAIM_URI" not in source, (
              "Email alias synchronization must remain disabled"
          )

          print("Verified nested Gson and unsigned JAR.")
          print("Verified immutable userName/externalId and disabled alias synchronization.")
          PY
      - name: Upload connector JAR
        uses: actions/upload-artifact@v4
        with:
          name: stalwart-scim-connector-2.0.1
          path: components/org.stalwart.identity.provisioning.connector.scim/target/*.jar
          if-no-files-found: error
          retention-days: 30
