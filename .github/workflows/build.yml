name: Build Stalwart SCIM Connector 2.0.8
on:
  push:
    branches: [ "feature/2.0.8", "main" ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stalwart-scim-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate installer scripts
        run: bash -n install.sh uninstall.sh
      - name: Build and run connector smoke tests
        run: mvn -B -ntp clean verify
      - name: Verify deployable OSGi bundle and no durable outbox dependency
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find components/org.stalwart.identity.provisioning.connector.scim/target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          python3 - "$JAR" <<'PY'
          import sys, zipfile
          jar=sys.argv[1]
          with zipfile.ZipFile(jar) as z:
              names=z.namelist()
              manifest=z.read("META-INF/MANIFEST.MF").decode()
          assert "Bundle-Version: 2.0.8.SNAPSHOT" in manifest, manifest
          assert "org/stalwart/identity/provisioning/connector/scim/StalwartSCIMProvisioningConnector.class" in names
          assert not any("Outbox" in n for n in names), "Legacy Outbox classes must not be packaged"
          assert "lib/gson-2.11.0.jar" in names, "Embedded Gson is missing"
          assert not any(n.startswith("org/wso2/") for n in names), "WSO2 API classes must not be embedded"
          print("Verified connector bundle version, embedded Gson, and absence of Outbox classes.")
          PY
          test -f config/stalwart-scim-connector.toml.example
          if grep -R -nE 'System\.err|printStackTrace|IRISA' components/org.stalwart.identity.provisioning.connector.scim/src/main README.md config; then
            echo "Debug stderr output or organization-specific attribution remains."
            exit 1
          fi
          if grep -R -nE 'HybridProfileOutbox|ScimOperationOutbox|hybrid-outbox|hybrid-scope-id|jdbc/WSO2CarbonDB|HYBRID' components/org.stalwart.identity.provisioning.connector.scim/src/main; then
            echo "Legacy durable Outbox/HYBRID references remain."
            exit 1
          fi
      - name: Upload connector JAR
        uses: actions/upload-artifact@v6
        with:
          name: stalwart-scim-connector-2.0.8-SNAPSHOT
          path: components/org.stalwart.identity.provisioning.connector.scim/target/*.jar
          if-no-files-found: error
          retention-days: 30
