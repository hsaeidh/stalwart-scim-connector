name: Build Stalwart SCIM Connector
on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stalwart-scim-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build OSGi bundle
        run: mvn -B -ntp clean package
      - name: Verify OSGi bundle metadata
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find components/org.stalwart.identity.provisioning.connector.scim/target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          python3 - "$JAR" <<'PY'
          import sys
          import zipfile

          jar = sys.argv[1]
          with zipfile.ZipFile(jar) as archive:
              raw = archive.read("META-INF/MANIFEST.MF").decode("utf-8")
          unfolded = []
          for line in raw.replace("\r\n", "\n").split("\n"):
              if line.startswith(" ") and unfolded:
                  unfolded[-1] += line[1:]
              else:
                  unfolded.append(line)
          attributes = {}
          for line in unfolded:
              if ": " in line:
                  key, value = line.split(": ", 1)
                  attributes[key] = value
          version = attributes.get("Bundle-Version", "")
          imports = attributes.get("Import-Package", "")
          assert version.startswith("1.0.3"), f"Unexpected Bundle-Version: {version!r}"
          assert "org.wso2.carbon.identity.provisioning" in imports, "Missing WSO2 provisioning package import"
          assert "org.wso2.carbon.identity.application.common" in imports, "Missing WSO2 application.common package import"
          print(f"Verified {jar}: Bundle-Version={version}")
          print("Verified WSO2 Import-Package entries.")
          PY
      - name: Upload connector JAR
        uses: actions/upload-artifact@v4
        with:
          name: stalwart-scim-connector-1.0.3
          path: components/org.stalwart.identity.provisioning.connector.scim/target/*.jar
          if-no-files-found: error
          retention-days: 30
